name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npx eslint src tests --ext .js,.jsx,.ts,.tsx

  test-node:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Prepare deterministic SQLite DB state
        run: |
          test -f prisma/dev.db
          echo "DB_SHA256=$(shasum -a 256 prisma/dev.db | awk '{print $1}')"
          ls -lh prisma/dev.db prisma/dev.db-wal prisma/dev.db-shm || true
          rm -f prisma/dev.db-wal prisma/dev.db-shm
          sqlite3 prisma/dev.db "PRAGMA integrity_check;"
          sqlite3 prisma/dev.db "SELECT name, rootpage FROM sqlite_master WHERE type='table' AND name IN ('JobAlert','RecommendationHistory') ORDER BY name;"

      - name: Generate Prisma client and verify delegates
        run: |
          npx prisma generate
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const p = new PrismaClient();
          console.log(Boolean(p.jobAlert), Boolean(p.recommendationHistory));
          p.$disconnect();
          NODE
        env:
          DATABASE_URL: file:./dev.db
      
      - name: Run Jest tests
        run: npm run test:coverage
        env:
          DATABASE_URL: file:./dev.db
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  test-python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Python dependencies
        run: |
          pip install pytest numpy pandas

      - name: Prepare deterministic SQLite DB state
        run: |
          test -f prisma/dev.db
          echo "DB_SHA256=$(shasum -a 256 prisma/dev.db | awk '{print $1}')"
          ls -lh prisma/dev.db prisma/dev.db-wal prisma/dev.db-shm || true
          rm -f prisma/dev.db-wal prisma/dev.db-shm
          sqlite3 prisma/dev.db "PRAGMA integrity_check;"
          sqlite3 prisma/dev.db "SELECT name, rootpage FROM sqlite_master WHERE type='table' AND name IN ('JobAlert','RecommendationHistory') ORDER BY name;"
      
      - name: Run Python tests
        run: |
          pytest tests/ -v --tb=short
        env:
          DATABASE_URL: file:./dev.db

  build:
    runs-on: macos-latest
    needs: [lint, test-node]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build

  e2e:
    runs-on: macos-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Build application
        run: npm run build
      
      - name: Run Playwright tests
        run: npm run test:e2e
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
