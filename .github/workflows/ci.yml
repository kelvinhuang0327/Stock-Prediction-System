name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npx eslint src tests --ext .js,.jsx,.ts,.tsx

  test-node:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Prepare deterministic SQLite DB state
        run: |
          test -f prisma/dev.db
          echo "DB_SHA256=$(shasum -a 256 prisma/dev.db | awk '{print $1}')"
          ls -lh prisma/dev.db prisma/dev.db-wal prisma/dev.db-shm || true
          rm -f prisma/dev.db-wal prisma/dev.db-shm
          sqlite3 prisma/dev.db "PRAGMA integrity_check;"
          sqlite3 prisma/dev.db "SELECT name, rootpage FROM sqlite_master WHERE type='table' AND name IN ('JobAlert','RecommendationHistory') ORDER BY name;"
          cp prisma/dev.db prisma/dev.test.db

      - name: Apply additive schema migrations to test database
        run: |
          sqlite3 prisma/dev.test.db < prisma/migrations/20260501000000_strategy_proposal_cto_decision/migration.sql
          sqlite3 prisma/dev.test.db < prisma/migrations/20260501000001_cto_review_run_signal_backlog/migration.sql
          sqlite3 prisma/dev.test.db < prisma/migrations/20260520000000_add_chip_available_at/migration.sql
          sqlite3 prisma/dev.test.db < prisma/migrations/20260601040000_p144_add_job_alert_and_recommendation_history/migration.sql
          sqlite3 prisma/dev.test.db < prisma/migrations/20261110000000_add_orchestrator_policy_persistence/migration.sql

      - name: Generate Prisma client and verify delegates
        run: |
          npx prisma generate
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          (async () => {
            const p = new PrismaClient();
            await Promise.all([
              p.strategyProposal.findMany({ take: 0, select: { ctoDecision: true, ctoDecisionReason: true } }),
              p.institutionalChip.findMany({ take: 0, select: { availableAt: true } }),
              p.ctoReviewRun.count(),
              p.ctoIntentSignal.count(),
              p.ctoBacklogItem.findMany({ take: 0, select: { lastSelectedAt: true, selectionCount: true } }),
              p.adaptivePolicyState.count(),
              p.executionPolicyState.count(),
              p.policyChangeHistory.count(),
              p.orchestratorSetting.findMany({ take: 0, select: { key: true, value: true } }),
              p.jobAlert.count(),
              p.recommendationHistory.count(),
            ]);
            console.log('Prisma delegates and additive schema migrations are available.');
            await p.$disconnect();
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
        env:
          DATABASE_URL: file:./dev.test.db
      
      - name: Run Jest tests
        run: npm run test:coverage -- --runInBand
        env:
          DATABASE_URL: file:./dev.test.db
      
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  test-python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      - name: Install Python dependencies
        run: |
          pip install pytest numpy pandas

      - name: Prepare deterministic SQLite DB state
        run: |
          test -f prisma/dev.db
          echo "DB_SHA256=$(shasum -a 256 prisma/dev.db | awk '{print $1}')"
          ls -lh prisma/dev.db prisma/dev.db-wal prisma/dev.db-shm || true
          rm -f prisma/dev.db-wal prisma/dev.db-shm
          sqlite3 prisma/dev.db "PRAGMA integrity_check;"
          sqlite3 prisma/dev.db "SELECT name, rootpage FROM sqlite_master WHERE type='table' AND name IN ('JobAlert','RecommendationHistory') ORDER BY name;"
      
      - name: Run Python tests
        run: |
          pytest tests/ -v --tb=short
        env:
          DATABASE_URL: file:./dev.db

  build:
    runs-on: macos-latest
    needs: [lint, test-node]
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build

  e2e:
    runs-on: macos-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Prepare deterministic SQLite DB state
        run: |
          test -f prisma/dev.db
          cp prisma/dev.db prisma/dev.test.db
          sqlite3 prisma/dev.test.db < prisma/migrations/20260501000000_strategy_proposal_cto_decision/migration.sql
          sqlite3 prisma/dev.test.db < prisma/migrations/20260501000001_cto_review_run_signal_backlog/migration.sql
          sqlite3 prisma/dev.test.db < prisma/migrations/20260520000000_add_chip_available_at/migration.sql
          sqlite3 prisma/dev.test.db < prisma/migrations/20260601040000_p144_add_job_alert_and_recommendation_history/migration.sql
          sqlite3 prisma/dev.test.db < prisma/migrations/20261110000000_add_orchestrator_policy_persistence/migration.sql
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      
      - name: Build application
        run: npm run build
      
      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          DATABASE_URL: file:./dev.test.db
      
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
